properties:
  id: 36fbd4e7-5630-4414-aa42-702a7fdded21
  displayName: Regsvr32 Rundll32 Image Loads Abnormal Extension
  status: disabled
  queryCondition:
    queryText: |-
      DeviceImageLoadEvents
      | where InitiatingProcessFileName has_any ("rundll32.exe","regsvr32.exe")
      | where FileName !endswith ".dll"
      | join (
      DeviceNetworkEvents
      | where InitiatingProcessFileName has_any ("rundll32.exe","regsvr32.exe")
      | where RemoteIPType == "Public"
      ) on InitiatingProcessFileName, InitiatingProcessId, InitiatingProcessCreationTime, InitiatingProcessCommandLine
      | project Timestamp, DeviceName, FileName, FolderPath, SHA1, InitiatingProcessFileName, InitiatingProcessCommandLine, LocalIP, LocalPort, RemoteIP, RemoteUrl, RemotePort, InitiatingProcessParentFileName
      | extend HostName = iff(DeviceName has '.', substring(DeviceName, 0, indexof(DeviceName, '.')), DeviceName)
      | extend DnsDomain = iff(DeviceName has '.', substring(DeviceName, indexof(DeviceName, '.') + 1), "")
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Regsvr32 Rundll32 Image Loads Abnormal Extension
      description: |-
        This query is looking for regsvr32.exe or rundll32.exe loading DLL images with other extensions than .dll.
        Joins the data to public network events.
        References:
        https://threathunt.blog/running-live-malware-for-threat-hunting-purposes/
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
        ips:
        - id: ip1
          addressColumn: LocalIP
        - id: ip2
          addressColumn: RemoteIP
        urls:
        - id: url1
          addressColumn: RemoteUrl
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1218
          subTechniques:
          - T1218.010
          - T1218.011
