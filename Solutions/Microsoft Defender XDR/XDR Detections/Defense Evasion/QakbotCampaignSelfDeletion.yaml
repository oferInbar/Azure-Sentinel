properties:
  id: xdr-47c02e21-3949-4e05-a28e-576cd75ff6f6
  displayName: Qakbot Campaign Self Deletion
  status: disabled
  queryCondition:
    queryText: |-
      DeviceProcessEvents | where Timestamp >= ago(1h)
      | where FileName =~ "ping.exe"
      | where InitiatingProcessFileName =~ "cmd.exe"
      | where (InitiatingProcessCommandLine has "calc.exe") and (InitiatingProcessCommandLine has "-n 6") and (InitiatingProcessCommandLine has "127.0.0.1")
      | project Timestamp, ProcessCommandLine, InitiatingProcessCommandLine, InitiatingProcessParentFileName, DeviceId, DeviceName
      | extend HostName = iff(DeviceName has '.', substring(DeviceName, 0, indexof(DeviceName, '.')), DeviceName)
      | extend DnsDomain = iff(DeviceName has '.', substring(DeviceName, indexof(DeviceName, '.') + 1), "")
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Qakbot Campaign Self Deletion
      description: Detects cmd-launched ping activity with calc.exe, loopback and delay tokens associated with Qakbot self-deletion.
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1070
