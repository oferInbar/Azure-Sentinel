properties:
  id: xdr-5bdc1504-880c-4b30-a39c-7c746535928d
  displayName: Doppelpaymer Stop Services
  status: disabled
  queryCondition:
    queryText: |-
      // Attempts to stop services and allow ransomware execution
      DeviceProcessEvents
      | where InitiatingProcessFileName startswith "psexe" and FileName =~ "powershell.exe" and
        ProcessCommandLine has "stop-service" and ProcessCommandLine has "sql" and ProcessCommandLine has "msexchange"
      | extend HostName = iff(DeviceName has '.', substring(DeviceName, 0, indexof(DeviceName, '.')), DeviceName)
      | extend DnsDomain = iff(DeviceName has '.', substring(DeviceName, indexof(DeviceName, '.') + 1), "")
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Doppelpaymer Stop Services
      description: Detects PsExec-origin PowerShell commands that stop services and contain both SQL and Exchange tokens. This activity can precede human-operated ransomware execution.
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
      tactics:
      - tactic: Execution
        techniques:
        - technique: T1059
      - tactic: DefenseEvasion
        techniques:
        - technique: T1562
