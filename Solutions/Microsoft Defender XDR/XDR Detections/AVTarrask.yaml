properties:
  id: 1785d372-b9fe-4283-96a6-3a1d83cabfd1
  displayName: AV detections related to Tarrask malware
  status: disabled
  queryCondition:
    queryText: |-
      let Tarrask_threats = dynamic(["HackTool:Win64/Tarrask!MS", "HackTool:Win64/Ligolo!MSR", "Behavior:Win32/ScheduledTaskHide.A", "Tarrask"]);
      DeviceInfo
      | extend DeviceName = tolower(DeviceName)
      | join kind=rightouter ( SecurityAlert
      | where ProviderName =~ "MDATP"
      | extend ThreatName = tostring(parse_json(ExtendedProperties).ThreatName)
      | extend ThreatFamilyName = tostring(parse_json(ExtendedProperties).ThreatFamilyName)
      | where ThreatName in~ (Tarrask_threats) or ThreatFamilyName in~ (Tarrask_threats)
      | extend CompromisedEntity = tolower(CompromisedEntity)
      ) on $left.DeviceName == $right.CompromisedEntity
      | summarize by DisplayName, ThreatName, ThreatFamilyName, PublicIP, AlertSeverity, Description, tostring(LoggedOnUsers), DeviceId, TenantId , bin(Timestamp, 1d), CompromisedEntity, tostring(LoggedOnUsers), ProductName, Entities
      | extend HostName = tostring(split(CompromisedEntity, ".")[0]), DomainIndex = toint(indexof(CompromisedEntity, '.'))
      | extend HostNameDomain = iff(DomainIndex != -1, substring(CompromisedEntity, DomainIndex + 1), CompromisedEntity)
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: AV detections related to Tarrask malware
      description: "'This query looks for Microsoft Defender AV detections related to Tarrask malware. In Microsoft Sentinel,\
        \ the SecurityAlerts table includes only the Device Name of the affected device, this query joins the DeviceInfo table\
        \ to clearly connect other information such as Device group, ip, logged-on users etc. \n This would allow the Microsoft\
        \ Sentinel analyst to have more context related to the alert, if available.\n Reference: https://www.microsoft.com/security/blog/2022/04/12/tarrask-malware-uses-scheduled-tasks-for-defense-evasion/'"
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: HostNameDomain
        ips:
        - id: ip1
          addressColumn: PublicIP
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1053
