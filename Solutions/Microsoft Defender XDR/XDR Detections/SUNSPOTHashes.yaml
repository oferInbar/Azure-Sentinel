properties:
  id: xdr-53e936c6-6c30-4d12-8343-b8a0456e8429
  displayName: SUNSPOT malware hashes
  status: disabled
  queryCondition:
    queryText: |-
      let SUNSPOT_Hashes = dynamic(["c45c9bda8db1d470f1fd0dcc346dc449839eb5ce9a948c70369230af0b3ef168", "0819db19be479122c1d48743e644070a8dc9a1c852df9a8c0dc2343e904da389"]);
      union isfuzzy=true(
      DeviceEvents
      | where InitiatingProcessSHA256 in (SUNSPOT_Hashes)),
      (DeviceImageLoadEvents
      | where InitiatingProcessSHA256 in (SUNSPOT_Hashes))
      | extend timestamp=TimeGenerated
      | extend HostName = tostring(split(DeviceName, ".")[0]), DomainIndex = toint(indexof(DeviceName, '.'))
      | extend HostNameDomain = iff(DomainIndex != -1, substring(DeviceName, DomainIndex + 1), DeviceName)
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: SUNSPOT malware hashes
      description: "'This query uses Microsoft Defender for Endpoint data to look for IoCs associated with the SUNSPOT malware\
        \ shared by Crowdstrike.\nMore details: \n  - https://www.crowdstrike.com/blog/sunspot-malware-technical-analysis/\n\
        \  - https://techcommunity.microsoft.com/blog/microsoftsentinelblog/monitoring-the-software-supply-chain-with-azure-sentinel/2176463/'"
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: HostNameDomain
        accounts:
        - id: account1
          nameColumn: InitiatingProcessAccountName
          upnSuffixColumn: InitiatingProcessAccountDomain
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1554
      customDetails:
        HostFullName: DeviceName
        AccountFullName: InitiatingProcessAccountUpn
