properties:
  id: xdr-d29cc957-0ddb-4d00-8d6f-ad1bb345ff9a
  displayName: Service Accounts Performing Remote PS
  status: disabled
  queryCondition:
    queryText: "let InteractiveTypes = pack_array(                                  // Declare Interactive logon type names\n\
      \    'Interactive',\n    'CachedInteractive',\n    'Unlock',\n    'RemoteInteractive',\n    'CachedRemoteInteractive',\n\
      \    'CachedUnlock'\n);\nlet WhitelistedCmdlets = pack_array(                                // List of whitelisted\
      \ commands that don't provide a lot of value\n    'prompt',\n    'Out-Default',\n    'out-lineoutput',\n    'format-default',\n\
      \    'Set-StrictMode',\n    'TabExpansion2'\n);\nlet WhitelistedAccounts = pack_array('FakeWhitelistedAccount');   \
      \  // List of accounts that are known to perform this activity in the environment and can be ignored\nDeviceLogonEvents\
      \                                                         // Get all logon events...\n| where AccountName !in~ (WhitelistedAccounts)\
      \                      // ...where it is not a whitelisted account...\n| where ActionType == \"LogonSuccess\"      \
      \                          // ...and the logon was successful...\n| where AccountName !contains \"$\"              \
      \                     // ...and not a machine logon.\n| where AccountName !has \"winrm va_\"                       \
      \         // WinRM will have pseudo account names that match this if there is an explicit permission for an admin to\
      \ run the cmdlet, so assume it is good.\n| extend IsInteractive=(LogonType in (InteractiveTypes))            // Determine\
      \ if the logon is interactive (True=1,False=0)...\n| summarize HasInteractiveLogon=max(IsInteractive)              \
      \    // ...then bucket and get the maximum interactive value (0 or 1)...\n            by AccountName               \
      \                           // ... by the AccountNames\n| where HasInteractiveLogon == 0                           \
      \         // ...and filter out all accounts that had an interactive logon.\n// At this point, we have a list of accounts\
      \ that we believe to be service accounts\n// Now we need to find RemotePS sessions that were spawned by those accounts\n\
      // Note that we look at all powershell cmdlets executed to form a 29-day baseline to evaluate the data on today\n| join\
      \ kind=rightsemi (                                             // Start by dropping the account name and only tracking\
      \ the...\n\tDeviceEvents                                                      // ...\n\t| where ActionType == 'PowerShellCommand'\
      \                         // ...PowerShell commands seen...\n\t| where InitiatingProcessFileName =~ 'wsmprovhost.exe'\
      \            // ...whose parent was wsmprovhost.exe (RemotePS Server)...\n    | extend AccountName = InitiatingProcessAccountName\
      \             // ...and add an AccountName field so the join is easier\n) on AccountName\n// At this point, we have\
      \ all of the commands that were ran by service accounts\n| extend Command = tostring(extractjson('$.Command', tostring(AdditionalFields)))\
      \ // Extract the actual PowerShell command that was executed\n| where Command !in (WhitelistedCmdlets)             \
      \                             // Remove any values that match the whitelisted cmdlets\n| summarize (Timestamp, ReportId)=arg_max(TimeGenerated,\
      \ ReportId),               // Then group all of the cmdlets and calculate the min/max times of execution...\n    make_set(Command,\
      \ 100000), count(), min(TimeGenerated) by                     // ...as well as creating a list of cmdlets ran and the\
      \ count..\n    AccountName, AccountDomain, DeviceName, DeviceId                                             // ...and\
      \ have the commonality be the account, DeviceName and DeviceId\n// At this point, we have machine-account pairs along\
      \ with the list of commands run as well as the first/last time the commands were ran\n| order by AccountName asc   \
      \                                     // Order the final list by AccountName just to make it easier to go through\n\
      | extend HostName = iff(DeviceName has '.', substring(DeviceName, 0, indexof(DeviceName, '.')), DeviceName)\n| extend\
      \ DnsDomain = iff(DeviceName has '.', substring(DeviceName, indexof(DeviceName, '.') + 1), \"\")"
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Service Accounts Performing Remote PS
      description: Uses server logon telemetry to identify accounts without interactive logons, then detects Remote PowerShell commands from those accounts, excluding configured commands and accounts.
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
        accounts:
        - id: account1
          dnsDomainColumn: AccountDomain
          nameColumn: AccountName
      tactics:
      - tactic: LateralMovement
        techniques:
        - technique: T1210
      customDetails:
        HostFullName: DeviceName
