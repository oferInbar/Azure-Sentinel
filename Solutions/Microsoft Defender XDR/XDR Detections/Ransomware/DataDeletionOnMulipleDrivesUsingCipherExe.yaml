properties:
  id: 03caa992-477f-4b19-8e2a-8cd58f8f9652
  displayName: Deletion of data on multiple drives using cipher exe
  status: disabled
  queryCondition:
    queryText: |-
      // Look for cipher.exe deleting data from multiple drives
      DeviceProcessEvents
      | where FileName =~ "cipher.exe"
      // cipher.exe /w flag used for deleting data
      | where ProcessCommandLine has "/w"
      | summarize CipherCount = dcount(ProcessCommandLine), CipherList = make_set(ProcessCommandLine, 1000) by DeviceId, DeviceName, bin(Timestamp, 1m)
      // cipher.exe accessing multiple drives in a short timeframe
      | where CipherCount > 1
      | extend HostName = iff(DeviceName has '.', substring(DeviceName, 0, indexof(DeviceName, '.')), DeviceName)
      | extend DnsDomain = iff(DeviceName has '.', substring(DeviceName, indexof(DeviceName, '.') + 1), "")
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Deletion of data on multiple drives using cipher exe
      description: This query checks for attempts to delete data on multiple drives using cipher.exe. This activity is typically
        done by ransomware to prevent recovery of data after encryption.
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
      tactics:
      - tactic: Impact
        techniques:
        - technique: T1485
