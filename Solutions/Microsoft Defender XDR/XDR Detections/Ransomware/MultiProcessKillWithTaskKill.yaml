properties:
  id: 4dd31bd5-11a3-4b9c-a7c5-4927ab4f2a77
  displayName: Stopping multiple processes using taskkill
  status: disabled
  queryCondition:
    queryText: |-
      // Find attempts to stop processes using taskkill.exe
      DeviceProcessEvents
      | where FileName =~ "taskkill.exe"
      | summarize taskKillCount = dcount(ProcessCommandLine), TaskKillList = make_set(ProcessCommandLine, 10000) by DeviceId, DeviceName, bin(Timestamp, 2m)
      | where taskKillCount > 10
      | extend HostName = iff(DeviceName has '.', substring(DeviceName, 0, indexof(DeviceName, '.')), DeviceName)
      | extend DnsDomain = iff(DeviceName has '.', substring(DeviceName, indexof(DeviceName, '.') + 1), "")
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Stopping multiple processes using taskkill
      description: This query checks for attempts to stop at least 10 separate processes using the taskkill.exe utility. This
        is a common technique used by ransomware to stop security products and other processes.
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1562
