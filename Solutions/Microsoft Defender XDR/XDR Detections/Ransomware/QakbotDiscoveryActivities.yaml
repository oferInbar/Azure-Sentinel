properties:
  id: ba9db6b2-3d05-42ae-8aee-3a15bbe29f27
  displayName: Qakbot Discovery Activies
  status: disabled
  queryCondition:
    queryText: |-
      DeviceProcessEvents
      | where InitiatingProcessFileName in~('mobsync.exe','explorer.exe')
      | where (FileName =~ 'net.exe' and InitiatingProcessCommandLine has_all('view','/all'))
           or (FileName =~ 'whoami.exe' and InitiatingProcessCommandLine has '/all')
           or (FileName =~ 'nslookup.exe' and InitiatingProcessCommandLine has_all('querytype=ALL','timeout=10'))
           or (FileName =~ 'netstat.exe' and InitiatingProcessCommandLine has '-nao')
           or (FileName =~ 'arp.exe' and InitiatingProcessCommandLine has '-a')
           or (FileName =~ 'ping.exe' and InitiatingProcessCommandLine has '-t' and InitiatingProcessCommandLine endswith '127.0.0.1')
      | summarize DiscoveryCommands = dcount(InitiatingProcessCommandLine), make_set(InitiatingProcessFileName), make_set(FileName), make_set(InitiatingProcessCommandLine) by DeviceId, DeviceName, bin(Timestamp, 5m)
      | where DiscoveryCommands >= 3
      | extend HostName = iff(DeviceName has '.', substring(DeviceName, 0, indexof(DeviceName, '.')), DeviceName)
      | extend DnsDomain = iff(DeviceName has '.', substring(DeviceName, indexof(DeviceName, '.') + 1), "")
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Qakbot Discovery Activies
      description: This query searches for injected processes launching discovery activity. Qakbot has been observed leading
        to ransomware in numerous instances. It looks for discovery commands such as net.exe, whoami.exe, nslookup.exe, netstat.exe,
        arp.exe, and ping.exe.
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
      tactics:
      - tactic: Discovery
        techniques:
        - technique: T1016
        - technique: T1018
        - technique: T1033
        - technique: T1049
