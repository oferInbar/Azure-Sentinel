properties:
  id: xdr-32b29155-3fd3-4a9e-a0ca-a67e2593b60b
  displayName: Disabling Security Services via Registry
  status: disabled
  queryCondition:
    queryText: |-
      DeviceProcessEvents
      | where InitiatingProcessCommandLine has_all(@'"reg"', 'add', @'"HKLM\SOFTWARE\Policies\', '/v','/t', 'REG_DWORD', '/d', '/f')
        and InitiatingProcessCommandLine has_any('DisableRealtimeMonitoring', 'UseTPMKey', 'UseTPMKeyPIN', 'UseAdvancedStartup',
        'EnableBDEWithNoTPM', 'RecoveryKeyMessageSource')
      | extend HostName = iff(DeviceName has '.', substring(DeviceName, 0, indexof(DeviceName, '.')), DeviceName)
      | extend DnsDomain = iff(DeviceName has '.', substring(DeviceName, indexof(DeviceName, '.') + 1), "")
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Disabling Security Services via Registry
      description: This query checks for processes modifying the registry to disable security features. This is a common technique
        used by threat actors for defence evasion.
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
        accounts:
        - id: account1
          nameColumn: AccountName
          ntDomainColumn: AccountDomain
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1562
      customDetails:
        AccountFullName: AccountUpn
        ProcessProcessId: ProcessId
        ProcessCommandLine: ProcessCommandLine
