properties:
  id: xdr-515d0bba-b297-4f83-8280-20ff7f27ecb1
  displayName: Clearing of forensic evidence from event logs using wevtutil
  status: disabled
  queryCondition:
    queryText: |-
      // Look for use of wevtutil to clear multiple logs
      DeviceProcessEvents | where Timestamp >= ago(1d)
      | where ProcessCommandLine has "WEVTUTIL" and ProcessCommandLine has "CL"
      | summarize LogClearCount = dcount(tostring(ProcessCommandLine)), ClearedLogList = make_set(ProcessCommandLine, 100000) by DeviceId, DeviceName, bin(Timestamp, 5m)
      | where LogClearCount > 10
      | extend HostName = iff(DeviceName has '.', substring(DeviceName, 0, indexof(DeviceName, '.')), DeviceName)
      | extend DnsDomain = iff(DeviceName has '.', substring(DeviceName, indexof(DeviceName, '.') + 1), "")
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: Clearing of forensic evidence from event logs using wevtutil
      description: This query checks for attempts to clear at least 10 log entries from event logs using wevtutil. Clearing
        event logs can be a sign of ransomware activity, as ransomware often attempts to cover its tracks by deleting logs.
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
      tactics:
      - tactic: DefenseEvasion
        techniques:
        - technique: T1070
