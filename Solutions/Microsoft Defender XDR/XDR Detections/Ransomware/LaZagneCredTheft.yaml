    eventTimeWindow:
      status: constrained
      originalSentinelLookbackSeconds: 3600
      effectiveEventWindowSeconds: 3600
      xdrServiceWindowSeconds: 14400
      sourceTimeColumn: TimeGenerated
      targetTimeColumn: Timestamp
      filterInjected: true
      rationale: A conservative single-native-table pipeline proof established the source and target input and time-column
        binding. The target Timestamp filter is placed immediately after the table input and before all filters, projections,
        and aggregations.
      lateIngestionRisk: 'Late-ingestion risk: events ingested after their Timestamp falls outside this constrained event-time
        window can be missed; runtime qualification is required.'
    supplementalEntityDetails:
    - entityType: Process
      entityIndex: 2
      identifier: ProcessId
      sourceColumn: ProcessId
      column: ProcessId
      status: available
