      parity is not established. See https://learn.microsoft.com/en-us/defender-xdr/custom-detection-rules#lookback'
    - Host.FullName `DeviceName` is safely represented by retained nameColumn `HostName` and dnsDomainColumn `DnsDomain`;
      the query explicitly decomposes that same full name. No fullNameColumn is emitted
    - Process.ProcessId mismatch is informational because its original value is preserved as customDetails.ProcessProcessId
      from query column `ProcessId`; supplemental details do not restore entity identity, correlation, or alert parity
    - Process.CommandLine mismatch is informational because its original value is preserved as customDetails.ProcessCommandLine
