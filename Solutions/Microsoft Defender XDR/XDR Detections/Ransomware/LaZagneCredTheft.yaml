properties:
  id: xdr-7d0d3050-8dac-4b83-bfae-902f7dc0c21c
  displayName: LaZagne Credential Theft
  status: disabled
  queryCondition:
    queryText: |-
      DeviceProcessEvents | where Timestamp >= ago(1h)
      | where FileName =~ 'reg.exe'
      | where ProcessCommandLine has_all('save','hklm','sam')
      | project DeviceId, DeviceName, Timestamp, InitiatingProcessId, InitiatingProcessFileName, ProcessId, FileName, ProcessCommandLine
      | extend HostName = iff(DeviceName has '.', substring(DeviceName, 0, indexof(DeviceName, '.')), DeviceName)
      | extend DnsDomain = iff(DeviceName has '.', substring(DeviceName, indexof(DeviceName, '.') + 1), "")
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: LaZagne Credential Theft
      description: LaZagne is a popular open-source tool used to recover passwords stored on a local computer. It has been
        used in ransomware attacks to steal credentials and escalate privileges. This query looks for the execution of LaZagne.
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1003
      customDetails:
        ProcessProcessId: ProcessId
        ProcessCommandLine: ProcessCommandLine
