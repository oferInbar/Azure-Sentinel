properties:
  id: c332b840-61e4-462e-a201-0e2d69bad45d
  displayName: LSASS Credential Dumping with Procdump
  status: disabled
  queryCondition:
    queryText: |-
      DeviceProcessEvents
      | where (FileName has_any ("procdump.exe", "procdump64.exe") and ProcessCommandLine has "lsass") or
      // Looking for Accepteula flag or Write a dump file with all process memory
      (ProcessCommandLine has "lsass.exe" and (ProcessCommandLine has "-accepteula" or ProcessCommandLine contains "-ma"))
      | extend HostName = iff(DeviceName has '.', substring(DeviceName, 0, indexof(DeviceName, '.')), DeviceName)
      | extend DnsDomain = iff(DeviceName has '.', substring(DeviceName, indexof(DeviceName, '.') + 1), "")
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: LSASS Credential Dumping with Procdump
      description: "This query was originally published in the threat analytics report, \"Exchange Server zero-days exploited\
        \ in the wild\".\nIn early March 2021, Microsoft released patches for four different zero-day vulnerabilities affecting\
        \ Microsoft Exchange Server. The vulnerabilities were being used in a coordinated attack. For more information on\
        \ the vulnerabilities, visit the following links:\n1. CVE-2021-26855\n2. CVE-2021-26857\n3. CVE-2021-26858\n4. CVE-2021-27065\n\
        The following query looks for evidence of Procdump being used to dump credentials from LSASS, the Local Security Authentication\
        \ Server. This might "
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1003
