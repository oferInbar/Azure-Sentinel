properties:
  id: xdr-1be34fb9-f81b-47ae-84fb-465e6686d76c
  displayName: DopplePaymer Procdump
  status: disabled
  queryCondition:
    queryText: |-
      // Dumping of LSASS memory using procdump
      DeviceProcessEvents
      // Command lines that include "lsass" and -accepteula or -ma flags used in procdump
      | where (ProcessCommandLine has "lsass" and (ProcessCommandLine has "-accepteula" or
      ProcessCommandLine contains "-ma"))
      // Omits possible FPs where the full command is just "procdump.exe lsass"
      or (FileName in~ ('procdump.exe','procdump64.exe') and ProcessCommandLine has 'lsass')
      | extend HostName = iff(DeviceName has '.', substring(DeviceName, 0, indexof(DeviceName, '.')), DeviceName)
      | extend DnsDomain = iff(DeviceName has '.', substring(DeviceName, indexof(DeviceName, '.') + 1), "")
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: DopplePaymer Procdump
      description: Detects command-line patterns associated with dumping LSASS memory, including ProcDump filenames and LSASS memory-dump flags. This activity can indicate credential theft associated with DoppelPaymer.
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
      tactics:
      - tactic: CredentialAccess
        techniques:
        - technique: T1003
