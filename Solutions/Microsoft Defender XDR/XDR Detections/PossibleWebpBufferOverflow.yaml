properties:
  id: xdr-26e81021-2de6-4442-a74a-a77885e96911
  displayName: Execution of software vulnerable to webp buffer overflow of CVE-2023-4863
  status: disabled
  queryCondition:
    queryText: |-
      //CVE-2023-4863 Process activity with .webp files on devices where CVE-2023-4863 is unpatched
      //This query shows all process activity with .webp files on vulnerable machines and is not an indicator of malicious activity
      let VulnDevices = DeviceTvmSoftwareVulnerabilities
          | where CveId == "CVE-2023-4863"
          | distinct DeviceId;
      union DeviceProcessEvents, DeviceNetworkEvents, DeviceEvents
      | where DeviceId in (VulnDevices) and (InitiatingProcessCommandLine has(".webp") or ProcessCommandLine has(".webp"))
      | extend Name = tostring(split(AccountUpn, "@")[0]), UPNSuffix = tostring(split(AccountUpn, "@")[1])
      | extend HostName = tostring(split(DeviceName, ".")[0]), DomainIndex = toint(indexof(DeviceName, '.'))
      | extend HostNameDomain = iff(DomainIndex != -1, substring(DeviceName, DomainIndex + 1), DeviceName)
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Execution of software vulnerable to webp buffer overflow of CVE-2023-4863
      description: '''This query looks at device, process, and network events from Defender for Endpoint that may be vulnerable
        to buffer overflow defined in CVE-2023-4863. Results are not an indicator of malicious activity.'''
      severity: informational
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: HostNameDomain
        accounts:
        - id: account1
          nameColumn: Name
          upnSuffixColumn: UPNSuffix
      tactics:
      - tactic: Execution
        techniques:
        - technique: T1203
