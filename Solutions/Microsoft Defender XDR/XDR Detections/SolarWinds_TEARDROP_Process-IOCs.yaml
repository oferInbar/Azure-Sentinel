properties:
  id: xdr-738702fd-0a66-42c7-8586-e30f0583f8fe
  displayName: TEARDROP memory-only dropper
  status: disabled
  queryCondition:
    queryText: |-
      DeviceEvents
      | where ActionType has "ExploitGuardNonMicrosoftSignedBlocked"
      | where InitiatingProcessFileName has "svchost.exe" and FileName has "NetSetupSvc.dll"
      | extend HashAlgorithm = "SHA1"
      | extend HostName = tostring(split(DeviceName, ".")[0]), DomainIndex = toint(indexof(DeviceName, '.'))
      | extend HostNameDomain = iff(DomainIndex != -1, substring(DeviceName, DomainIndex + 1), DeviceName)
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: TEARDROP memory-only dropper
      description: |-
        Identifies SolarWinds TEARDROP memory-only dropper IOCs in Window's defender Exploit Guard activity
        References:
        - https://www.fireeye.com/blog/threat-research/2020/12/evasive-attacker-leverages-solarwinds-supply-chain-compromises-with-sunburst-backdoor.html
        - https://gist.github.com/olafhartong/71ffdd4cab4b6acd5cbcd1a0691ff82f
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: HostNameDomain
        accounts:
        - id: account1
          nameColumn: InitiatingProcessAccountName
          upnSuffixColumn: InitiatingProcessAccountDomain
      tactics:
      - tactic: Execution
        techniques:
        - technique: T1059
      - tactic: Persistence
        techniques:
        - technique: T1543
      - tactic: DefenseEvasion
        techniques:
        - technique: T1027
      customDetails:
        HostFullName: DeviceName
        AccountFullName: InitiatingProcessAccountUpn
        FileHashAlgorithm: HashAlgorithm
        FileHashValue: InitiatingProcessSHA1
