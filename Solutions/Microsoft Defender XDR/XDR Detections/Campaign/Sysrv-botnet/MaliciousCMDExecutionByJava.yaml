properties:
  id: xdr-2c81c0a0-9823-4a14-b21a-2b4acd3335d2
  displayName: Java Executing cmd to run Powershell
  status: disabled
  queryCondition:
    queryText: |-
      DeviceProcessEvents
      | where InitiatingProcessFileName == 'java.exe' and FileName == 'cmd.exe'
      and ProcessCommandLine has_all('powershell iex','DownloadString')
      | extend HostName = iff(DeviceName has '.', substring(DeviceName, 0, indexof(DeviceName, '.')), DeviceName)
      | extend DnsDomain = iff(DeviceName has '.', substring(DeviceName, indexof(DeviceName, '.') + 1), "")
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Java Executing cmd to run Powershell
      description: |-
        This query was originally published in the threat analytics report, Sysrv botnet evolution.
        Sysrv is a Go-based botnet that targets both Windows and Linux servers, and steals resources to mine cryptocurrency.
        The following query finds instances of the Java process being used to execute cmd.exe, and download and execute a PowerShell script.
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
      tactics:
      - tactic: Execution
        techniques:
        - technique: T1059
