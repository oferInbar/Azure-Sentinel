properties:
  id: c25a8cd4-5b4a-45a8-9ba0-3b753a652f6b
  displayName: Deimos Component Execution
  status: disabled
  queryCondition:
    queryText: |-
      DeviceEvents
      | where InitiatingProcessFileName =~ "powershell.exe"
      | where ActionType == "AmsiScriptContent"
      | where AdditionalFields endswith '[mArS.deiMos]::inteRaCt()"}'
      | project InitiatingProcessParentFileName, InitiatingProcessFileName, InitiatingProcessCommandLine, ActionType, AdditionalFields, DeviceName
      | extend HostName = iff(DeviceName has '.', substring(DeviceName, 0, indexof(DeviceName, '.')), DeviceName)
      | extend DnsDomain = iff(DeviceName has '.', substring(DeviceName, indexof(DeviceName, '.') + 1), "")
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Deimos Component Execution
      description: Jupyter, otherwise known as SolarMarker, is a malware family and cluster of components known for its info-stealing
        and backdoor capabilities that mainly proliferates through search engine optimization manipulation and malicious advertising
        in order to successfully encourage users to download malicious templates and documents. This malware has been popular
        since 2020 and currently is still active as of 2021.
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
      tactics:
      - tactic: Execution
        techniques:
        - technique: T1059
