properties:
  id: xdr-174de33b-107b-4cd8-a85d-b4025a35453f
  displayName: Office Apps Launching Wscipt
  status: disabled
  queryCondition:
    queryText: |-
      DeviceProcessEvents
      | where InitiatingProcessFileName in~ ('winword.exe', 'excel.exe', 'outlook.exe')
      | where FileName =~ "wscript.exe" and ProcessCommandLine has ".jse"
      | extend HostName = iff(DeviceName has '.', substring(DeviceName, 0, indexof(DeviceName, '.')), DeviceName)
      | extend DnsDomain = iff(DeviceName has '.', substring(DeviceName, indexof(DeviceName, '.') + 1), "")
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Office Apps Launching Wscipt
      description: Detects Word, Excel or Outlook launching wscript.exe to execute a JScript Encoded file. This behavior is associated with malicious Office macros and Trickbot activity.
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
      tactics:
      - tactic: Execution
        techniques:
        - technique: T1059
        - technique: T1203
      - tactic: Collection
      - tactic: CommandAndControl
        techniques:
        - technique: T1105
      customDetails:
        ProcessProcessId: ProcessId
        ProcessCommandLine: ProcessCommandLine
