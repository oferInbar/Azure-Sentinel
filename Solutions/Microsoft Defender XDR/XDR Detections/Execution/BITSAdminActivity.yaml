properties:
  id: 2a1dc4c2-a8d6-4a0e-8539-9b971c851195
  displayName: Bitsadmin Activity
  status: disabled
  queryCondition:
    queryText: |-
      DeviceProcessEvents
      | where
          (FileName =~ "bitsadmin.exe" or column_ifexists('ProcessVersionInfoOriginalFileName','ColumnNotAvailable') =~ 'bitsadmin.exe')
          and ProcessCommandLine has_any ('/Transfer','/AddFile', '/AddFileSet','/AddFileWithRanges')
      | extend
          ParsedCommandLine = parse_command_line(ProcessCommandLine,'windows')
      | extend
          RemoteUrl = tostring(ParsedCommandLine[-2]),
          LocalFile= tostring(ParsedCommandLine[-1]),
          Direction = iff(ProcessCommandLine has "/Upload", 'Upload', 'Download')
      | project-reorder
          Timestamp,
          DeviceId,
          DeviceName,
          Direction,
          RemoteUrl,
          LocalFile,
          InitiatingProcessFolderPath,
          InitiatingProcessAccountDomain,
          InitiatingProcessAccountName,
          InitiatingProcessSHA256,
          ProcessId,
          ProcessCommandLine
      | extend HostName = iff(DeviceName has '.', substring(DeviceName, 0, indexof(DeviceName, '.')), DeviceName)
      | extend DnsDomain = iff(DeviceName has '.', substring(DeviceName, indexof(DeviceName, '.') + 1), "")
  schedule:
    frequency: PT1H
  detectionAction:
    alertTemplate:
      title: Bitsadmin Activity
      description: "Background Intelligent Transfer Service (BITS) is a way to reliably download files from webservers or\
        \ SMB servers. \nThis service is commonly used for legitimate purposes, but can also be used as part of a malware\
        \ downloader. \nAdditionally, bitsadmin can be used to upload files and therefore can be used for data exfiltration.\
        \ This\nquery will identify use of bitsadmin.exe for either purpose and will identify directionality file transfer\n\
        directionality."
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: DnsDomain
      tactics:
      - tactic: Persistence
        techniques:
        - technique: T1197
