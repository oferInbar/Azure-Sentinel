properties:
  id: xdr-a3c144f9-8051-47d4-ac29-ffb0c312c910
  displayName: SUNBURST and SUPERNOVA backdoor hashes
  status: disabled
  queryCondition:
    queryText: |-
      let SunburstMD5=dynamic(["b91ce2fa41029f6955bff20079468448","02af7cec58b9a5da1c542b5a32151ba1","2c4a910a1299cdae2a4e55988a2f102e","846e27a652a5e1bfbd0ddd38a16dc865","4f2eb62fa529c0283b28d05ddd311fae"]);
      let SupernovaMD5="56ceb6d0011d87b6e4d7023d7ef85676";
      DeviceFileEvents
      | where MD5 in(SunburstMD5) or MD5 in(SupernovaMD5)
      | extend HashAlgorithm = "MD5"
      | extend HostName = tostring(split(DeviceName, ".")[0]), DomainIndex = toint(indexof(DeviceName, '.'))
      | extend HostNameDomain = iff(DomainIndex != -1, substring(DeviceName, DomainIndex + 1), DeviceName)
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: SUNBURST and SUPERNOVA backdoor hashes
      description: |-
        Identifies SolarWinds SUNBURST and SUPERNOVA backdoor file hash IOCs in DeviceFileEvents
        References:
        - https://www.fireeye.com/blog/threat-research/2020/12/evasive-attacker-leverages-solarwinds-supply-chain-compromises-with-sunburst-backdoor.html
        - https://gist.github.com/olafhartong/71ffdd4cab4b6acd5cbcd1a0691ff82f
      severity: high
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: HostNameDomain
        accounts:
        - id: account1
          nameColumn: InitiatingProcessAccountName
          upnSuffixColumn: InitiatingProcessAccountDomain
      tactics:
      - tactic: Execution
        techniques:
        - technique: T1059
      - tactic: Persistence
        techniques:
        - technique: T1546
      - tactic: InitialAccess
        techniques:
        - technique: T1195
      customDetails:
        HostFullName: DeviceName
        AccountFullName: InitiatingProcessAccountUpn
        FileHashAlgorithm: HashAlgorithm
        FileHashValue: MD5
