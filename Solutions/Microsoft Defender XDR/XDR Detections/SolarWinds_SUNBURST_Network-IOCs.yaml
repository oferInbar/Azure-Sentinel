properties:
  id: ce1e7025-866c-41f3-9b08-ec170e05e73e
  displayName: SUNBURST network beacons
  status: disabled
  queryCondition:
    queryText: |-
      let SunburstURL=dynamic(["panhardware.com","databasegalore.com","avsvmcloud.com","freescanonline.com","thedoccloud.com","deftsecurity.com"]);
      DeviceNetworkEvents
      | where ActionType == "ConnectionSuccess"
      | where RemoteUrl in(SunburstURL)
      | extend HashAlgorithm = 'MD5'
      | extend HostName = tostring(split(DeviceName, ".")[0]), DomainIndex = toint(indexof(DeviceName, '.'))
      | extend HostNameDomain = iff(DomainIndex != -1, substring(DeviceName, DomainIndex + 1), DeviceName)
  schedule:
    frequency: P1D
  detectionAction:
    alertTemplate:
      title: SUNBURST network beacons
      description: |-
        Identifies SolarWinds SUNBURST domain beacon IOCs in DeviceNetworkEvents
        References:
        - https://www.fireeye.com/blog/threat-research/2020/12/evasive-attacker-leverages-solarwinds-supply-chain-compromises-with-sunburst-backdoor.html
        - https://gist.github.com/olafhartong/71ffdd4cab4b6acd5cbcd1a0691ff82f
      severity: medium
      entityMappings:
        hosts:
        - id: host1
          nameColumn: HostName
          dnsDomainColumn: HostNameDomain
        accounts:
        - id: account1
          nameColumn: InitiatingProcessAccountName
          upnSuffixColumn: InitiatingProcessAccountDomain
        ips:
        - id: ip1
          addressColumn: RemoteIP
        urls:
        - id: url1
          addressColumn: RemoteUrl
      tactics:
      - tactic: CommandAndControl
